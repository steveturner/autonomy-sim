[package]
name = "autonomy-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Defensive ISR autonomy, mission, C2, and visualization simulator"

[features]
default = []
ditto-real = ["dep:autonomy-sim-ditto-real", "autonomy-sim-ditto-real/dittoffi"]

[dependencies]
anyhow.workspace = true
autonomy-sim-ditto-real = { path = "../autonomy-sim-ditto-real", optional = true }
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3.23"
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "real_ditto_runtime"
path = "tests/real_ditto_runtime.rs"
required-features = ["ditto-real"]
