[workspace]
members = [
    "crates/autonomy-sim",
    "crates/autonomy-sim-ditto-real",
    "crates/autonomy-sim-net-sigforge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/steveturner/autonomy-sim"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cc = "1.2"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
quick-xml = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
