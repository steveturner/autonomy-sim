# Defensive force-protection simulation for a protected civilian World Cup
# stadium. All effects are abstract probability/state transitions; this
# scenario contains no fire-control, ballistics, aiming, or guidance model.

[scenario]
name = "cuas-stadium"
description = "Layered defensive C-UAS funnel protects a World Cup stadium using real-Ditto-coordinated sensors, EW, interceptors, and an abstract last layer"
seed = 20260626
realtime = true
builder = "cuas"

[simulation]
tick_hz = 5.0
network_backend = "analytic"

[api]
bind = "127.0.0.1:9000"

[cot]
sink = "disabled"
interval_s = 1.0
stale_after_s = 10

[cuas]
protected_site_id = "world-cup-stadium"
detection_range_m = 3200.0
detection_delay_s = 0.8
ew_capacity = 4
ew_effect_delay_s = 1.4
ew_success_probability = 0.55
interceptor_capacity = 3
interceptor_range_m = 2100.0
intercept_time_s = 3.0
intercept_success_probability = 0.80
gun_range_m = 850.0
gun_effect_delay_s = 2.0
gun_success_probability = 0.65

[[nodes]]
id = "world-cup-stadium"
name = "Protected World Cup Stadium"
kind = "protected_site"
affiliation = "friendly"
domain = "ground"
mission_role = "protected_civilian_site"
position = { lat_deg = 33.9535, lon_deg = -118.3392, alt_m = 36.0 }
[nodes.mission]
playbook = "hold"

# Defender nodes are the only Ditto peers. Their co-located mesh radios form a
# common operating picture around the venue.
[[nodes]]
id = "radar-north"
name = "North Defensive Radar / EO"
kind = "radar_sensor"
affiliation = "friendly"
domain = "ground"
mission_role = "detection"
position = { lat_deg = 33.9580, lon_deg = -118.3392, alt_m = 43.0 }
radios = [{ link_type = "mesh", range_m = 2500.0, capacity_bps = 8000000, base_latency_ms = 8.0 }]
[nodes.mission]
