# Grass Valley Air Attack Base at Nevada County Airport (KGOO). This Ditto
# peer is the AAB supervisor and authors fire-cell and reload-queue documents.
[[nodes]]
id = "grass-valley-aab"
name = "Grass Valley Air Attack Base"
kind = "base"
affiliation = "friendly"
domain = "ground"
mission_role = "air_attack_base"
position = { lat_deg = 39.2244, lon_deg = -121.0030, alt_m = 1017.0 }

[[nodes.radios]]
link_type = "mesh"
range_m = 25000.0
capacity_bps = 8000000
base_latency_ms = 10.0

[[nodes.radios]]
link_type = "satcom"
range_m = 150000.0
capacity_bps = 2000000
base_latency_ms = 140.0

[nodes.mission]
playbook = "hold"
human_authorized = true

# Lead plane/supervisor support aircraft; it performs ISR/coordination only.
[[nodes]]
id = "lead-01"
name = "Paradise Lead Plane"
kind = "uas"
affiliation = "friendly"
domain = "air"
mission_role = "leadplane"
position = { lat_deg = 39.2252, lon_deg = -121.0040, alt_m = 1650.0 }

[[nodes.radios]]
link_type = "mesh"
range_m = 25000.0
capacity_bps = 8000000
base_latency_ms = 10.0

[[nodes.radios]]
link_type = "satcom"
range_m = 150000.0
capacity_bps = 2000000
base_latency_ms = 140.0

[nodes.mission]
playbook = "persistent_surveillance"
speed_mps = 70.0
center = { lat_deg = 39.7596, lon_deg = -121.6219, alt_m = 1650.0 }
radius_m = 1800.0
human_authorized = true

