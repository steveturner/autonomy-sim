# Defensive wildfire aerial-firefighting simulation. The mission contains no
# weapons or engagement logic: aircraft coordinate retardant drops and reloads.

[scenario]
name = "wildfire-paradise"
description = "Twelve UAS air tankers coordinate fire-suppression drops between Grass Valley AAB and Paradise"
seed = 20261108
realtime = true
builder = "wildfire"

[simulation]
tick_hz = 5.0
network_backend = "analytic"

[api]
bind = "127.0.0.1:9000"

[cot]
sink = "disabled"
interval_s = 1.0
stale_after_s = 10

[wildfire]
base_id = "grass-valley-aab"
supervisor_id = "grass-valley-aab"
reload_slots = 3
reload_time_s = 45.0
drop_duration_s = 5.0
drop_effect = 45.0
on_station_s = 3.0
egress_time_s = 12.0
launch_interval_s = 4.0
arrival_radius_m = 650.0
base_arrival_radius_m = 350.0
approach_distance_m = 4000.0
base_approach_lane_deg = 135.0
spread_per_s = 0.04

[wildfire.flocking]
neighbor_radius_m = 2400.0
separation_radius_m = 280.0
separation_weight = 1.8
alignment_weight = 0.8
cohesion_weight = 0.55
goal_weight = 3.2
min_speed_mps = 78.0
max_speed_mps = 96.0
max_turn_rate_deg_s = 12.0

[[wildfire.fire_cells]]
id = "paradise-fire-01"
name = "Paradise Fire Cell 01"
position = { lat_deg = 39.7596, lon_deg = -121.6219, alt_m = 532.0 }
intensity = 92.0

